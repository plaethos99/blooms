name: Build game

# Exports a portable Windows build, an Android APK and an unsigned iPhone IPA with Godot.
# Every push to main uploads them as workflow artifacts; pushing a tag like v0.5
# also attaches them to a GitHub Release. The IPA is unsigned: sideload it with
# Sideloadly (or AltStore), which signs it with your own Apple ID.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios_only:
        description: "Only build the iPhone IPA"
        type: boolean
        default: false
      release_tag:
        description: "Also attach the IPA to this existing release (e.g. v0.9.1)"
        type: string
        default: ""

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    if: ${{ !inputs.ios_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Android signing)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot-bin
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv templates/* "$dest/"
          rm -f ./*.zip ./*.tpz

      - name: Install Godot
        run: |
          sudo ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Configure Android SDK and signing
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/ci/android-debug.keystore"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${keystore}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' ~/.config/godot/$f
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${keystore}"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # Each CI build gets a higher Android version code so it installs over the last one.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Import project
        run: godot --headless --import

      - name: Export Windows (portable)
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/LastLight.exe
          test -f build/windows/LastLight.exe
          (cd build/windows && zip -q -r ../LastLight-windows-portable.zip .)

      - name: Export Android (APK)
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/LastLight.apk
          test -f build/android/LastLight.apk
          cp build/android/LastLight.apk build/LastLight-android.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LastLight-windows-portable
          path: build/windows/

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: LastLight-android
          path: build/LastLight-android.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/LastLight-windows-portable.zip
            build/LastLight-android.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot (macOS) and the iOS template
        id: cache-godot-mac
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-mac
            ~/godot-templates
          key: godot-mac-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and the iOS export template
        if: steps.cache-godot-mac.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-mac ~/godot-templates
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d ~/godot-mac
          curl -sSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz "templates/ios.zip" "templates/version.txt"
          mv templates/* ~/godot-templates/
          rm -f godot.zip tpl.tpz

      - name: Install Godot and the template
        run: |
          set -euo pipefail
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-templates/* "$dest/"
          echo "GODOT=$HOME/godot-mac/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          # Godot's iOS library is built against the iOS 26 SDK: use the newest Xcode here.
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Import project
        run: '"$GODOT" --headless --import || true'

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --export-release "iOS" build/ios/LastLight.ipa 2>&1 | tail -40
          ls -la build/ios

      - name: Build the unsigned IPA
        run: |
          set -euo pipefail
          cd build/ios
          proj=$(ls -d *.xcodeproj | head -1)
          xcodebuild -list -project "$proj"
          scheme=$(xcodebuild -list -json -project "$proj" | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          xcodebuild -project "$proj" -scheme "$scheme" -configuration Release -sdk iphoneos             -destination 'generic/platform=iOS' -derivedDataPath dd             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""             build | tail -30
          app=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "Built $app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry ../LastLight-ios.ipa Payload
          ls -la ../LastLight-ios.ipa

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: LastLight-ios
          path: build/LastLight-ios.ipa

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The tag's Windows/Android job may still be creating the release.
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" build/LastLight-ios.ipa --clobber
